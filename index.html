<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>niSab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F6F4EF;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #0F6B52, #0a4f3c);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 24px; margin-bottom: 10px; }
        .card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .btn {
            background: #0F6B52;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>niSab</h1>
        <p>Март 2026</p>
    </div>
    
    <div class="card">
        <h3>Свободный остаток</h3>
        <p style="font-size: 28px; font-weight: bold; margin: 10px 0;">0 ₽</p>
    </div>
    
    <div class="card">
        <p>Ассаляму алейкум! Добавьте первую операцию.</p>
        <button class="btn" onclick="alert('Добавление операции')">+ Добавить трату</button>
    </div>
    
    <script>
        console.log('niSab loaded successfully');
    </script>
</body>
</html>
